name: Refresh Profile Telemetry

on:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches:
      - main
      - master
    paths:
      - 'scripts/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fonttools brotli

      - name: Build SVG asset suite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build.py

      - name: Commit and push changes
        run: |
          git config --local user.email "337345008+sshloktiwarii@users.noreply.github.com"
          git config --local user.name "Shlok Tiwari"
          git add assets/
          if git diff --staged --quiet; then
            echo "Assets are up to date. Nothing to commit."
          else
            git commit -m "chore(assets): automated profile telemetry refresh [skip ci]"
            git push
          fi
